name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center Package/Identity/Name (e.g. TGSAStudio.TWStock-)'
        required: true
        default: 'TGSAStudio.TWStock-'
        type: string
      publisher_cn:
        description: 'Partner Center Package/Identity/Publisher'
        required: true
        default: 'CN=357D3BC5-5BA3-4612-8287-1B9D2B3CDB1A'
        type: string
      publisher_display_name:
        description: 'Partner Center PublisherDisplayName'
        required: false
        default: 'TGSA Studio'
        type: string
      display_name:
        description: 'Reserved Product DisplayName in Partner Center'
        required: false
        default: 'Stock TW'
        type: string

jobs:
  build-msix:
    name: Build Unsigned MSIX for Microsoft Store
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Build release binaries (x64 & arm64)
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Package MSIX (Windows SDK makeappx)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File msix\build_msix.ps1 `
            -IdentityName "${{ inputs.identity_name }}" `
            -Publisher "${{ inputs.publisher_cn }}" `
            -PublisherDisplayName "${{ inputs.publisher_display_name }}" `
            -DisplayName "${{ inputs.display_name }}" `
            -Arch "x64" `
            -Target "x86_64-pc-windows-msvc"
          powershell -NoProfile -ExecutionPolicy Bypass -File msix\build_msix.ps1 `
            -IdentityName "${{ inputs.identity_name }}" `
            -Publisher "${{ inputs.publisher_cn }}" `
            -PublisherDisplayName "${{ inputs.publisher_display_name }}" `
            -DisplayName "${{ inputs.display_name }}" `
            -Arch "arm64" `
            -Target "aarch64-pc-windows-msvc"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-tw-msix
          path: dist\StockTW-*.msix
          if-no-files-found: error
