[package]
name = "simple_stock"
version = "1.3.4"
edition = "2024"
description = "Lightweight Windows real-time stock dashboard for Taiwan and US markets"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
