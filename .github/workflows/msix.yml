name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center Package/Identity/Name (e.g. 12345tgsastudio.StockTW)'
        required: true
        type: string
      publisher_cn:
        description: 'Partner Center Package/Identity/Publisher (e.g. CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX)'
        required: true
        type: string
      publisher_display_name:
        description: 'Partner Center PublisherDisplayName'
        required: false
        default: 'tgsastudio'
        type: string

jobs:
  build-msix:
    name: Build Unsigned MSIX for Microsoft Store
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package MSIX (Windows SDK makeappx)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File msix\build_msix.ps1 `
            -IdentityName "${{ inputs.identity_name }}" `
            -Publisher "${{ inputs.publisher_cn }}" `
            -PublisherDisplayName "${{ inputs.publisher_display_name }}"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-tw-msix
          path: dist\StockTW-x64-*.msix
          if-no-files-found: error
