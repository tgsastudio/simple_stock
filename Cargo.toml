[package]
name = "simple_stock"
version = "1.0.0"
edition = "2024"
description = "Lightweight Windows real-time stock dashboard for Taiwan and US markets"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
