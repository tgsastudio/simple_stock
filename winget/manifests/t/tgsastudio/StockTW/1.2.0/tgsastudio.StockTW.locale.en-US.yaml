ShortDescription: Lightweight native Windows real-time stock dashboard for Taiwan and US markets.
Description: >-
  Stock TW is a lightweight, no-login Windows real-time stock dashboard for Taiwan (TWSE/TPEx)
  and US markets built with pure Rust and native Win32 GDI (~6-7 MB RAM, ~0% idle CPU).
  Features Standard and Floating Widget modes, portfolio P&L tracking, DPAPI-encrypted local
  storage, market-hours-aware polling, and 6 UI languages.
